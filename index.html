<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>TPL Season 5 · THORE Premier League</title>
<link rel="icon" href="assets/logo-sm.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/logo.webp">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash">
  <img class="logo" src="assets/logo.webp" alt="TPL Season 5 – Stronger. Bolder.">
  <p>THORE Premier League</p>
  <span class="sweep"></span>
</div>

<header id="top">
  <img class="mark" src="assets/logo-sm.webp" alt="">
  <div class="brand">TPL<b>S5</b></div>
  <div id="pill" class="pill"></div>
  <button id="refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg></button>
</header>

<main id="app">
  <section id="individual" class="view"></section>
  <section id="team" class="view" hidden></section>
</main>

<nav id="nav">
  <i id="ind"></i>
  <button data-v="individual" class="on">Individual</button>
  <button data-v="team">Team</button>
</nav>

<div id="detail" aria-hidden="true"></div>
<div id="closed" hidden></div>
<script src="app.js"></script>
</body>
</html>
